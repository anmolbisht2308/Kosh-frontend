# Next.js on Netlify needs its OpenNext-based runtime. Sites created in the Netlify UI get it automatically;
# declaring it here makes the repo work however the site was created.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# One address for search engines: the netlify.app name forwards to the custom domain.
[[redirects]]
  from = "https://kosh-money.netlify.app/*"
  to = "https://kosh.anmolbisht.com/:splat"
  status = 301
  force = true
